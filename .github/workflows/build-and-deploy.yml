name: Optimize map and deploy

on: [ push ]

permissions:
  contents: write
  pages: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: "Install dependencies"
        run: npm ci

      - name: "Build scripts"
        run: npm run build && npm run optimize

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@releases/v3
        if: github.ref == 'refs/heads/master'
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages # The branch the action should deploy to.
          FOLDER: dist/ # The folder the action should deploy.
          BASE_BRANCH: master

      # The office loads the map from this map-storage, not from GitHub Pages.
      - name: Upload to the map-storage
        if: github.ref == 'refs/heads/master'
        run: npx --yes --package=@workadventure/upload-maps@1.8.1 upload-wa-map
        env:
          MAP_STORAGE_URL: https://edu.im.elos.vc/map-storage/
          UPLOAD_DIRECTORY: mconf/office
          MAP_STORAGE_API_KEY: ${{ secrets.MAP_STORAGE_API_KEY }}

      - name: Bash2
        run: |
          ls -al
