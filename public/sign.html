<!doctype html>
<!--
  Sign embedded in the map by "website" objects.
    sign.html?text=Sala+do+Live           fixed text
    sign.html?zone=sala1&text=Sala+%231   live, pushed by the bridge: the portal room bound to the
                                          zone (scrolling when it doesn't fit) on a red-marked
                                          plate, blank when unbound, `text` while the bridge
                                          can't be reached
-->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; color: #000; white-space: nowrap;
    font: 700 clamp(8px, (100vh - 8px) * 0.7, 22px)/1 ui-monospace, monospace;
  }
  /* the stage's projection-screen cloth, stretched by 9-slice at its native pixel scale */
  #plate {
    flex: 1; min-height: 0; box-sizing: border-box; padding: 0 2px; position: relative;
    display: flex; align-items: center; justify-content: center;
    border: 4px solid; border-image: url(sign-screen.png) 4 fill stretch; image-rendering: pixelated;
  }
  /* busy: red over the cloth, its texture and dark border kept (multiply) */
  #plate::before { content: ""; position: absolute; inset: -4px; pointer-events: none; } /* over the cloth's rim too */
  #view { position: relative; }
  .busy { color: #8e1b14; }
  .busy #plate::before { background: #f5b9b2; mix-blend-mode: multiply; }
  #view { overflow: hidden; }
  /* marquee: two copies of the text slide left by one copy's width, forever */
  .scroll #view { flex: 1; }
  .scroll #track { display: inline-block; animation: marquee var(--duration) linear infinite; }
  .scroll #track span { padding-right: 2.5em; }
  @keyframes marquee { to { transform: translateX(-50%); } }
</style>
</head>
<body>
<div id="plate"><div id="view"><span id="track"></span></div></div>
<script>
  const BRIDGE = "https://wpb.h.elos.dev"; // TEMP local wpb test — revert to https://wpb.h.elos.dev before commit

  // Status pushed by the bridge (Server-Sent Events): now, then on every change.
  // EventSource reconnects by itself; meanwhile the sign shows its fixed name.
  function watchZone(zone, onChange) {
    const events = new EventSource(`${BRIDGE}/zones/${encodeURIComponent(zone)}/events`);
    events.onmessage = (e) => {
      const { room_name } = JSON.parse(e.data);
      room_name ? onChange("busy", room_name) : onChange("free");
    };
    events.onerror = () => onChange("unknown");
  }

  const params = new URLSearchParams(location.search);
  const zone = params.get("zone");
  const fallback = params.get("text") || "";
  const view = document.getElementById("view");
  const track = document.getElementById("track");
  const PX_PER_SECOND = 25;

  // state: "free" | "busy" | "" (unknown)
  function show(text, state) {
    const box = document.body;
    box.className = state;
    box.style.fontSize = "";
    track.textContent = text;
    // not laid out yet (or fits): the resize handler renders again
    if (!view.clientWidth || track.offsetWidth <= view.clientWidth) return;
    if (!state) {
      // fixed names are short: shrink a little rather than scroll
      let size = parseFloat(getComputedStyle(box).fontSize);
      while (size > 8 && track.offsetWidth > view.clientWidth) box.style.fontSize = --size + "px";
      return;
    }
    // a room name too long for one line scrolls instead of wrapping
    track.replaceChildren(...[0, 1].map(() => Object.assign(document.createElement("span"), { textContent: text })));
    box.classList.add("scroll");
    box.style.setProperty("--duration", track.offsetWidth / 2 / PX_PER_SECOND + "s");
  }

  let last = [fallback, ""];
  const render = () => show(...last);
  document.fonts.ready.then(render);
  addEventListener("resize", render);
  render();

  if (zone) {
    watchZone(zone, (state, name) => {
      last = state === "busy" ? [name, "busy"] : state === "free" ? ["", "free"] : [fallback, ""];
      render();
    });
  }
</script>
</body>
</html>
